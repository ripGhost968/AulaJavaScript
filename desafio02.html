<body>
    <h1>Desafio 2</h1>
    <hr>
    <h2 id="resultado"></h2>

    <script>
        let num1 = parseFloat (window.prompt("Digite um número:"));
        let num2 = parseFloat (window.prompt("Digite outro número:"));
        let operacao = window.prompt("Digite + ou -");
        let resultado = 0

        if (operacao == "+") {
            resultado = num1 + num2
        } else {
            resultado = num1 - num2
        }

        document.getElementById("resultado").innerText = "o resultado da operação é: " + resultado
</script>

</body>
